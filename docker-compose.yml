version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  lanyard:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - REDIS_URI=redis://redis:6379
      - PORT=4001
      - COMMAND_PREFIX=.
      - BOT_PRESENCE=you <3
      - BOT_PRESENCE_TYPE=3
    ports:
      - "4001:4001"

volumes:
  redis_data: